[package]
name = "my-remote-speaker"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["sbchild <sbchild0@gmail.com>"]

[dependencies]
chrono = "0.4.45"
crossfire = { version = "3.1.19", features = ["tokio"] }
dashmap = "6.2.1"
futures-util = "0.3.34"
iroh = "1.1.0"
iroh-blobs = "0.103.0"
opus = "0.4.0"
pastey = "0.2.3"
rmp-serde = "1.3.1"
rsntp = "4.1.2"
serde = "1.0.229"
serde_bytes = "0.11.19"
tarpc = { version = "0.38.0", features = ["full"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace]
resolver = "3"
members = ["mrs-speaker", "mrs-client"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
