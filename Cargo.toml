[package]
name = "my-remote-speaker"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["sbchild <sbchild0@gmail.com>"]

[dependencies]
dashmap = "6.2.1"
iroh = "1.1.0"
iroh-blobs = "0.103.0"
opus = "0.4.0"
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_bytes = "0.11.19"
tarpc = { version = "0.38.0", features = ["full"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }

[workspace]
resolver = "3"
members = ["mrs-speaker", "mrs-client"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
