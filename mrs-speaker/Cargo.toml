[package]
name = "mrs-speaker"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["sbchild <sbchild0@gmail.com>"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
cpal = { version = "0.18.2", features = ["realtime"] }
iroh = "1.1.0"
iroh-mainline-address-lookup = "0.5.0"
iroh-mdns-address-lookup = "0.5.0"
pipewire = { version = "0.10.1", optional = true }
pretty-hex = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
snafu = { version = "0.9.2", features = ["futures"] }
tarpc = { version = "0.38.0", features = ["full"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
my-remote-speaker = { path = "../" }
iroh-blobs = "0.103.0"
tokio-util = { version = "0.7.19", features = ["io"] }
futures = "0.3.34"
surrealkv = "0.21.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"

[features]
default = ["use-pipewire"]
use-pipewire = ["dep:pipewire", "cpal/pipewire"]
